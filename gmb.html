<html lang="zh-CN" data-theme="dark">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="canonical" href="https://myworkbench-tools.vercel.app/gmb.html">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="小巴到站">
<meta property="og:description" content="專線小巴實時到站看板：輸路線、選站，即見下三班車還有幾分鐘到。">
<meta property="og:url" content="https://myworkbench-tools.vercel.app/gmb.html">
<meta property="og:image" content="https://myworkbench-tools.vercel.app/og.svg">
<meta property="og:image:width" content="1200">

</head>
<body>
<header class="topbar">
  <div class="brand-wrap">
    <h1 class="brand-title-wrap">
      <button class="brand" id="brandBtn" aria-haspopup="true" aria-expanded="false" title="切换工具">
        <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="13" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="7.5" cy="18.5" r="1.8"/><circle cx="16.5" cy="18.5" r="1.8"/></g></svg></span>
        <span class="brand-text">
          <span class="brand-title">小巴到站</span>
          <span class="brand-sub">專線小巴實時到站 · data.gov.hk</span>
        </span>
        <span class="brand-chev">▾</span>
      </button>
    </h1>
    <div class="brand-menu" id="brandMenu" hidden>
      <button class="brand-item" data-page="index.html">
        <span class="logo small">&lt;/&gt;</span>
        <span class="brand-item-text"><strong>Code 格式化</strong><em>粘贴 · 格式化 · 验证 · 多语言</em></span>
      </button>
      <button class="brand-item" data-page="qr.html">
        <span class="logo small"><svg viewBox="0 0 21 21" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M0 0h7v7H0zM1 1h5v5H1zM2 2h3v3H2zM14 0h7v7h-7zM15 1h5v5h-5zM16 2h3v3h-3zM0 14h7v7H0zM1 15h5v5H1zM2 16h3v3H2zM8 6h1v1H8zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h1v1h-1zM16 6h1v1h-1zM18 6h1v1h-1zM20 6h1v1h-1zM6 8h1v1H6zM6 10h1v1H6zM6 12h1v1H6zM6 14h1v1H6zM6 16h1v1H6zM6 18h1v1H6zM6 20h1v1H6zM9 1h1v1H9zM11 3h1v1h-1zM9 5h1v1H9zM12 2h1v1h-1zM10 8h1v1h-1zM12 9h1v1h-1zM9 11h1v1H9zM11 12h1v1h-1zM13 10h1v1h-1zM8 10h1v1H8zM16 9h1v1h-1zM18 11h1v1h-1zM15 12h1v1h-1zM17 14h1v1h-1zM19 16h1v1h-1zM9 18h1v1H9zM12 19h1v1h-1zM15 17h1v1h-1zM18 19h1v1h-1zM11 20h1v1h-1zM16 20h1v1h-1zM19 9h1v1h-1zM10 16h1v1h-1zM13 15h1v1h-1z"/></svg></span>
        <span class="brand-item-text"><strong>二维码 / 条码生成器</strong><em>QR Code · 条码</em></span>
      </button>
      <button class="brand-item" data-page="password.html">
        <span class="logo small"><svg viewBox="0 0 21 21" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="4"/><line x1="9.6" y1="9.6" x2="18" y2="18"/><line x1="14" y1="14" x2="17" y2="11"/><line x1="16.5" y1="16.5" x2="18.5" y2="14.5"/></g></svg></span>
        <span class="brand-item-text"><strong>密码生成器</strong><em>随机密码 · 助记词 · 随机数</em></span>
      </button>
      <button class="brand-item active" data-page="gmb.html">
        <span class="logo small"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="13" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="7.5" cy="18.5" r="1.8"/><circle cx="16.5" cy="18.5" r="1.8"/></g></svg></span>
        <span class="brand-item-text"><strong>小巴到站</strong><em>專線小巴實時到站</em></span>
        <span class="brand-check">✓</span>
      </button>
    </div>
  </div>
  <div class="top-actions">
    <label class="theme-label">主题
      <select id="themeSelect">
        <option value="dark" selected>深色</option>
        <option value="light">浅色</option>
        <option value="retro">复古</option>
        <option value="oracle">Oracle</option>
        <option value="oracle-light">Oracle 白</option>
        <option value="datagrip">DataGrip</option>
        <option value="jetbrains">JetBrains</option>
      </select>
    </label>
  </div>
</header>

<main class="gmb-wrap">
  <section class="gmb-card gmb-search">
    <div class="gmb-search-row">
      <label class="gmb-route-label">路線
        <input type="text" id="routeInput" value="87M" placeholder="例如 87M" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="小巴路線號碼">
      </label>
      <button class="btn primary" id="btnSearch">查路線</button>
      <button class="btn" id="btnRefresh" title="重新查一次到站時間">刷新</button>
      <label class="check gmb-auto"><input type="checkbox" id="autoRefresh" checked> 每 30 秒自動刷新</label>
    </div>
    <div class="gmb-chips" id="recentChips"></div>
    <p class="hint">只支援專線小巴（綠色小巴），例如 87M、87A、1、12；九巴 / 城巴不在這套數據裡。地區不用選，會自動試新界、九龍、港島。</p>
  </section>

  <section class="gmb-card" id="routeCard" hidden>
    <div class="gmb-route-line">
      <span class="gmb-route-code" id="routeCode">87M</span>
      <span class="hint" id="routeRegion"></span>
      <span class="spacer"></span>
      <span class="hint" id="routeUpdated"></span>
    </div>
    <div class="gmb-dir" id="dirBtns" role="tablist" aria-label="方向"></div>
  </section>

  <section class="gmb-eta" id="etaBoard" aria-live="polite">
    <div class="eta-card" id="eta0">
      <div class="eta-label">下一班</div>
      <div class="eta-min">—</div>
      <div class="eta-time">—</div>
      <div class="eta-remark">—</div>
    </div>
    <div class="eta-card" id="eta1">
      <div class="eta-label">再下一班</div>
      <div class="eta-min">—</div>
      <div class="eta-time">—</div>
      <div class="eta-remark">—</div>
    </div>
    <div class="eta-card" id="eta2">
      <div class="eta-label">第三班</div>
      <div class="eta-min">—</div>
      <div class="eta-time">—</div>
      <div class="eta-remark">—</div>
    </div>
  </section>
  <p class="gmb-stop-name" id="stopName">正在載入 87M…</p>

  <section class="gmb-card">
    <div class="gmb-stop-head">
      <span>上車站（點一下切換）</span>
      <span class="spacer"></span>
      <input type="text" id="stopFilter" placeholder="搜尋站名…" aria-label="搜尋站名" spellcheck="false">
    </div>
    <div class="stop-list" id="stopList"></div>
  </section>

  <p class="hint gmb-foot">數據：運輸署專線小巴實時到站，經政府資料一線通 data.gov.hk（data.etagmb.gov.hk），每分鐘更新；到站時間僅供參考，以實際交通為準。本頁只向該政府接口發請求，不上傳任何資料。</p>
</main>

<footer class="statusbar">
  <span id="statusDot" class="dot idle"></span>
  <span id="statusText">就緒</span>
  <span class="spacer"></span>
  <span id="detailStats"></span>
</footer>

<div class="toast" id="toast" hidden></div>
<script src="gmb.js"></script>
</body>
</html>
