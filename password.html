<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器</title>
<meta name="description" content="在线密码生成器：随机强密码与词组密码，用浏览器内置的安全随机数本地生成，不上传、不保存，刷新页面即消失。">
<meta name="theme-color" content="#0f1115">
<link rel="canonical" href="https://myworkbench-tools.vercel.app/password.html">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="密码生成器">
<meta property="og:description" content="随机强密码与词组密码，浏览器内置安全随机数本地生成，不上传、不保存。">
<meta property="og:url" content="https://myworkbench-tools.vercel.app/password.html">
<meta property="og:image" content="https://myworkbench-tools.vercel.app/og.svg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="密码生成器">
<meta name="twitter:description" content="随机强密码与词组密码，浏览器内置安全随机数本地生成，不上传、不保存。">
<meta name="twitter:image" content="https://myworkbench-tools.vercel.app/og.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand-wrap">
    <h1 class="brand-title-wrap">
      <button class="brand" id="brandBtn" aria-haspopup="true" aria-expanded="false" title="切换工具">
        <span class="logo"><svg viewBox="0 0 21 21" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="4"/><line x1="9.6" y1="9.6" x2="18" y2="18"/><line x1="14" y1="14" x2="17" y2="11"/><line x1="16.5" y1="16.5" x2="18.5" y2="14.5"/></g></svg></span>
        <span class="brand-text">
          <span class="brand-title">密码生成器</span>
          <span class="brand-sub">随机强密码 · 本地生成</span>
        </span>
        <span class="brand-chev">▾</span>
      </button>
    </h1>
    <div class="brand-menu" id="brandMenu" hidden>
      <button class="brand-item" data-page="index.html">
        <span class="logo small">&lt;/&gt;</span>
        <span class="brand-item-text"><strong>Code 格式化</strong><em>粘贴 · 格式化 · 验证 · 多语言</em></span>
      </button>
      <button class="brand-item" data-page="qr.html">
        <span class="logo small"><svg viewBox="0 0 21 21" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M0 0h7v7H0zM1 1h5v5H1zM2 2h3v3H2zM14 0h7v7h-7zM15 1h5v5h-5zM16 2h3v3h-3zM0 14h7v7H0zM1 15h5v5H1zM2 16h3v3H2zM8 6h1v1H8zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h1v1h-1zM16 6h1v1h-1zM18 6h1v1h-1zM20 6h1v1h-1zM6 8h1v1H6zM6 10h1v1H6zM6 12h1v1H6zM6 14h1v1H6zM6 16h1v1H6zM6 18h1v1H6zM6 20h1v1H6zM9 1h1v1H9zM11 3h1v1h-1zM9 5h1v1H9zM12 2h1v1h-1zM10 8h1v1h-1zM12 9h1v1h-1zM9 11h1v1H9zM11 12h1v1h-1zM13 10h1v1h-1zM8 10h1v1H8zM16 9h1v1h-1zM18 11h1v1h-1zM15 12h1v1h-1zM17 14h1v1h-1zM19 16h1v1h-1zM9 18h1v1H9zM12 19h1v1h-1zM15 17h1v1h-1zM18 19h1v1h-1zM11 20h1v1h-1zM16 20h1v1h-1zM19 9h1v1h-1zM10 16h1v1h-1zM13 15h1v1h-1z"/></svg></span>
        <span class="brand-item-text"><strong>二维码 / 条码生成器</strong><em>QR Code · 条码</em></span>
      </button>
      <button class="brand-item active" data-page="password.html">
        <span class="logo small"><svg viewBox="0 0 21 21" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="4"/><line x1="9.6" y1="9.6" x2="18" y2="18"/><line x1="14" y1="14" x2="17" y2="11"/><line x1="16.5" y1="16.5" x2="18.5" y2="14.5"/></g></svg></span>
        <span class="brand-item-text"><strong>密码生成器</strong><em>随机强密码 · 词组密码</em></span>
        <span class="brand-check">✓</span>
      </button>
    </div>
  </div>
  <div class="top-actions">
    <label class="theme-label">主题
      <select id="themeSelect">
        <option value="dark" selected>深色</option>
        <option value="light">浅色</option>
        <option value="retro">复古</option>
        <option value="oracle">Oracle</option>
        <option value="oracle-light">Oracle 白</option>
        <option value="datagrip">DataGrip</option>
        <option value="jetbrains">JetBrains</option>
      </select>
    </label>
  </div>
</header>

<section class="toolbar">
  <div class="group">
    <label>模式
      <select id="modeSelect">
        <option value="random" selected>随机密码</option>
        <option value="passphrase">词组密码</option>
      </select>
    </label>
    <button class="btn primary" id="btnGenerate">生成</button>
    <button class="btn" id="btnCopy">复制密码</button>
  </div>
  <span class="spacer"></span>
  <div class="group">
    <span class="hint">密码只在浏览器里生成，不上传、不保存</span>
  </div>
</section>

<main class="panes" id="panes">
  <section class="pane pane-left" id="paneLeft">
    <div class="pane-head">
      <span>设置</span>
    </div>
    <div class="pw-options">
      <div class="pw-row" id="lengthRow">
        <label>长度 <span class="pw-value" id="lengthValue">16</span></label>
        <input type="range" id="lengthRange" min="8" max="64" step="1" value="16" aria-label="密码长度">
        <input type="number" id="lengthNum" min="8" max="64" step="1" value="16" aria-label="密码长度数字">
      </div>
      <div class="pw-row" id="wordsRow" hidden>
        <label>词数 <span class="pw-value" id="wordsValue">4</span></label>
        <input type="range" id="wordsRange" min="3" max="6" step="1" value="4" aria-label="词组词数">
        <input type="number" id="wordsNum" min="3" max="6" step="1" value="4" aria-label="词组词数数字">
      </div>
      <div class="pw-row" id="charsetRow">
        <label>字符集</label>
        <div class="pw-checks">
          <label class="check"><input type="checkbox" id="setUpper" checked> 大写字母 A–Z</label>
          <label class="check"><input type="checkbox" id="setLower" checked> 小写字母 a–z</label>
          <label class="check"><input type="checkbox" id="setDigits" checked> 数字 0–9</label>
          <label class="check"><input type="checkbox" id="setSymbols" checked> 符号 !@#$%^&amp;*</label>
        </div>
      </div>
      <div class="pw-row" id="ambRow">
        <label class="check"><input type="checkbox" id="excludeAmbiguous"> 排除易混淆字符（0 O 1 l I）</label>
      </div>
      <div class="pw-row" id="sepRow" hidden>
        <label>分隔符
          <select id="sepSelect">
            <option value="-" selected>-</option>
            <option value="_">_</option>
            <option value=".">.</option>
            <option value=" ">空格</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="capitalize"> 每个词首字母大写</label>
      </div>
      <p class="pw-note">生成的密码不会保存到任何地方，刷新页面就消失。用完请存到你自己的密码管理器里。</p>
    </div>
  </section>

  <div class="divider" id="divider" title="拖动调整左右宽度"></div>

  <section class="pane pane-right" id="paneRight">
    <div class="pane-head">
      <span>结果</span>
      <span class="spacer"></span>
      <span class="hint" id="entropyText"></span>
    </div>
    <div class="pw-result">
      <button class="pw-output" id="pwOutput" title="点一下复制密码" aria-label="生成的密码，点一下复制"></button>
      <div class="pw-strength">
        <div class="pw-meter"><div class="pw-meter-fill" id="strengthFill"></div></div>
        <span class="pw-strength-label" id="strengthLabel"></span>
        <span class="hint" id="crackText"></span>
      </div>
      <div class="pw-alts-head">备选（点一下换成这个）</div>
      <div class="pw-alts" id="pwAlts"></div>
    </div>
  </section>
</main>

<footer class="statusbar">
  <span id="statusDot" class="dot idle"></span>
  <span id="statusText">就绪</span>
  <span class="spacer"></span>
  <span class="footer-hint">用浏览器内置的安全随机数生成 · 不上传 · 不保存</span>
</footer>

<div class="toast" id="toast" hidden></div>
<script src="password.js"></script>
</body>
</html>
