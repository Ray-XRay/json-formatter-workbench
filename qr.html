<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<meta name="theme-color" content="#0f1115">
<link rel="canonical" href="https://myworkbench-tools.vercel.app/qr.html">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="二维码 / 条码生成器">
<meta property="og:description" content="QR Code 与 Code 128 一键生成，尺寸精确固定，支持 GS1 参数表与模板导入。全部在浏览器本地完成，不上传数据。">
<meta property="og:url" content="https://myworkbench-tools.vercel.app/qr.html">
<meta property="og:image" content="https://myworkbench-tools.vercel.app/og.svg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="二维码 / 条码生成器">
<meta name="twitter:description" content="QR Code 与 Code 128 一键生成，尺寸精确固定，支持 GS1 参数表与模板导入。">
<meta name="twitter:image" content="https://myworkbench-tools.vercel.app/og.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand-wrap">
    <h1 class="brand-title-wrap">
      <button class="brand" id="brandBtn" aria-haspopup="true" aria-expanded="false" title="切换工具">
        <span class="logo"><svg viewBox="0 0 21 21" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M0 0h7v7H0zM1 1h5v5H1zM2 2h3v3H2zM14 0h7v7h-7zM15 1h5v5h-5zM16 2h3v3h-3zM0 14h7v7H0zM1 15h5v5H1zM2 16h3v3H2zM8 6h1v1H8zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h1v1h-1zM16 6h1v1h-1zM18 6h1v1h-1zM20 6h1v1h-1zM6 8h1v1H6zM6 10h1v1H6zM6 12h1v1H6zM6 14h1v1H6zM6 16h1v1H6zM6 18h1v1H6zM6 20h1v1H6zM9 1h1v1H9zM11 3h1v1h-1zM9 5h1v1H9zM12 2h1v1h-1zM10 8h1v1h-1zM12 9h1v1h-1zM9 11h1v1H9zM11 12h1v1h-1zM13 10h1v1h-1zM8 10h1v1H8zM16 9h1v1h-1zM18 11h1v1h-1zM15 12h1v1h-1zM17 14h1v1h-1zM19 16h1v1h-1zM9 18h1v1H9zM12 19h1v1h-1zM15 17h1v1h-1zM18 19h1v1h-1zM11 20h1v1h-1zM16 20h1v1h-1zM19 9h1v1h-1zM10 16h1v1h-1zM13 15h1v1h-1z"/></svg></span>
        <span class="brand-text">
          <span class="brand-title">二维码 / 条码生成器</span>
          <span class="brand-sub">QR Code · 条码</span>
        </span>
        <span class="brand-chev">▾</span>
      </button>
    </h1>
    <div class="brand-menu" id="brandMenu" hidden>
      <button class="brand-item" data-page="index.html">
        <span class="logo small">&lt;/&gt;</span>
        <span class="brand-item-text"><strong>Code 格式化</strong><em>粘贴 · 格式化 · 验证 · 多语言</em></span>
      </button>
      <button class="brand-item active" data-page="qr.html">
        <span class="logo small"><svg viewBox="0 0 21 21" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M0 0h7v7H0zM1 1h5v5H1zM2 2h3v3H2zM14 0h7v7h-7zM15 1h5v5h-5zM16 2h3v3h-3zM0 14h7v7H0zM1 15h5v5H1zM2 16h3v3H2zM8 6h1v1H8zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h1v1h-1zM16 6h1v1h-1zM18 6h1v1h-1zM20 6h1v1h-1zM6 8h1v1H6zM6 10h1v1H6zM6 12h1v1H6zM6 14h1v1H6zM6 16h1v1H6zM6 18h1v1H6zM6 20h1v1H6zM9 1h1v1H9zM11 3h1v1h-1zM9 5h1v1H9zM12 2h1v1h-1zM10 8h1v1h-1zM12 9h1v1h-1zM9 11h1v1H9zM11 12h1v1h-1zM13 10h1v1h-1zM8 10h1v1H8zM16 9h1v1h-1zM18 11h1v1h-1zM15 12h1v1h-1zM17 14h1v1h-1zM19 16h1v1h-1zM9 18h1v1H9zM12 19h1v1h-1zM15 17h1v1h-1zM18 19h1v1h-1zM11 20h1v1h-1zM16 20h1v1h-1zM19 9h1v1h-1zM10 16h1v1h-1zM13 15h1v1h-1z"/></svg></span>
        <span class="brand-item-text"><strong>二维码 / 条码生成器</strong><em>QR Code · 条码</em></span>
        <span class="brand-check">✓</span>
      </button>
      <button class="brand-item" data-page="password.html">
        <span class="logo small"><svg viewBox="0 0 21 21" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="4"/><line x1="9.6" y1="9.6" x2="18" y2="18"/><line x1="14" y1="14" x2="17" y2="11"/><line x1="16.5" y1="16.5" x2="18.5" y2="14.5"/></g></svg></span>
        <span class="brand-item-text"><strong>密码生成器</strong><em>随机密码 · 助记词 · 随机数</em></span>
      </button>
      <button class="brand-item" data-page="gmb.html">
        <span class="logo small"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="13" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="7.5" cy="18.5" r="1.8"/><circle cx="16.5" cy="18.5" r="1.8"/></g></svg></span>
        <span class="brand-item-text"><strong>到站看板</strong><em>小巴 · 巴士 · 港鐵實時到站</em></span>
      </button>
    </div>
  </div>
  <div class="top-actions">
    <label class="theme-label">主题
      <select id="themeSelect">
        <option value="dark" selected>深色</option>
        <option value="light">浅色</option>
        <option value="retro">复古</option>
        <option value="oracle">Oracle</option>
        <option value="oracle-light">Oracle 白</option>
        <option value="datagrip">DataGrip</option>
        <option value="jetbrains">JetBrains</option>
      </select>
    </label>
  </div>
</header>

<section class="toolbar">
  <div class="group">
    <label>类型
      <select id="formatSelect">
        <option value="qrcode" selected>QR Code 二维码</option>
        <option value="code128">条码</option>
      </select>
    </label>
    <button class="btn primary" id="btnGenerate">生成</button>
    <button class="btn" id="btnSample">载入示例</button>
    <button class="btn" id="btnGs1Sample" title="载入一条 GS1 Digital Link 示例，用参数表生成 GS1 链接与二维码来测试">GS1 示例</button>
  </div>
  <div class="group options">
    <label>大小
      <select id="scaleSelect">
        <option value="small">小</option>
        <option value="medium" selected>中</option>
        <option value="large">大</option>
      </select>
    </label>
    <label id="ecWrap">纠错级别
      <select id="ecSelect">
        <option value="L">L · 7%</option>
        <option value="M" selected>M · 15%</option>
        <option value="Q">Q · 25%</option>
        <option value="H">H · 30%</option>
      </select>
    </label>
    <label class="check" id="textWrap"><input type="checkbox" id="showText" checked> 显示下方文字</label>
  </div>
  <div class="group">
    <label>前景 <input type="color" id="fgColor" value="#000000"></label>
    <label>背景 <input type="color" id="bgColor" value="#ffffff"></label>
  </div>
  <span class="spacer"></span>
  <div class="group">
    <button class="btn" id="btnDownloadPng">下载 PNG</button>
    <button class="btn" id="btnDownloadSvg">下载 SVG</button>
    <button class="btn" id="btnCopyImage">复制图片</button>
  </div>
</section>

<main class="panes" id="panes">
  <section class="pane pane-left" id="paneLeft">
    <div class="pane-head">
      <span>内容</span>
      <span class="spacer"></span>
      <button class="btn ghost small" id="btnClear">清空</button>
      <span class="hint" id="inputStats">0 字符</span>
    </div>
    <div class="editor-wrap">
      <textarea id="qrInput" spellcheck="false" placeholder="输入要编码的内容…"></textarea>
    </div>
    <div class="qr-hint" id="formatHint"></div>
    <div class="divider-h" id="gs1Divider" hidden title="拖动调整 GS1 参数区的高度"></div>
    <div class="gs1-panel" id="gs1Panel" hidden>
      <div class="gs1-head">
        <span>GS1 参数</span>
        <span class="hint" id="gs1Count"></span>
        <span class="spacer"></span>
        <button class="btn ghost small" id="btnGs1ResetNames" title="把所有 AI 的显示名称恢复成默认">恢复默认名称</button>
        <button class="btn ghost small" id="btnGs1Close" title="收起 GS1 参数">收起</button>
      </div>
      <div class="gs1-template">
        <input type="text" id="gs1TemplateInput" placeholder="粘贴模板 URL 导入，如 https://…/01/…" aria-label="GS1 模板 URL" spellcheck="false">
        <button class="btn small" id="btnGs1Import">导入模板</button>
      </div>
      <div class="gs1-table" id="gs1Table"></div>
      <div class="gs1-add">
        <input type="text" id="gs1NewAi" placeholder="AI，如 10" aria-label="新参数的 AI 代码" spellcheck="false">
        <input type="text" id="gs1NewValue" placeholder="值" aria-label="新参数的值" spellcheck="false">
        <button class="btn small" id="btnGs1Add">添加</button>
      </div>
    </div>
    <div class="qr-history" id="qrHistoryPanel" hidden>
      <div class="qr-history-head">
        <span>生成历史</span>
        <span class="spacer"></span>
        <button class="btn ghost small" id="btnQrHistoryClear" title="清空生成历史">清空</button>
      </div>
      <div class="qr-history-list" id="qrHistoryList"></div>
    </div>
  </section>

  <div class="divider" id="divider" title="拖动调整左右宽度"></div>

  <section class="pane pane-right" id="paneRight">
    <div class="pane-head">
      <span>预览</span>
      <span class="hint" id="qrStats">等待生成</span>
    </div>
    <div class="qr-preview" id="qrPreview">
      <canvas id="qrCanvas" hidden></canvas>
      <p class="qr-empty" id="qrEmpty">输入内容后自动生成</p>
    </div>
  </section>
</main>

<footer class="statusbar">
  <span id="statusDot" class="dot idle"></span>
  <span id="statusText">就绪</span>
  <span class="spacer"></span>
  <span id="detailStats"></span>
</footer>

<div class="toast" id="toast" hidden></div>

<script src="bwip-js-min.js"></script>
<script src="qr.js"></script>
</body>
</html>
