<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code 格式化工作台</title>
<meta name="description" content="在线 Code 格式化工作台：支持 JSON、SQL、Python、Go、Java，格式化、压缩、验证、树形视图、生成类型、转 YAML、JSON 对比，全部在浏览器本地完成，不上传数据。">
<meta name="theme-color" content="#0f1115">
<link rel="canonical" href="https://myworkbench-tools.vercel.app/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="Code 格式化工作台">
<meta property="og:description" content="JSON、SQL、Python、Go、Java 一键格式化、验证与转换，另有二维码 / 条码生成器。全部在浏览器本地完成，不上传数据。">
<meta property="og:url" content="https://myworkbench-tools.vercel.app/">
<meta property="og:image" content="https://myworkbench-tools.vercel.app/og.svg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Code 格式化工作台">
<meta name="twitter:description" content="JSON、SQL、Python、Go、Java 一键格式化、验证与转换，另有二维码 / 条码生成器。">
<meta name="twitter:image" content="https://myworkbench-tools.vercel.app/og.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand-wrap">
    <h1 class="brand-title-wrap">
      <button class="brand" id="brandBtn" aria-haspopup="true" aria-expanded="false" title="切换工具">
        <span class="logo">&lt;/&gt;</span>
        <span class="brand-text">
          <span class="brand-title">Code 格式化工作台</span>
          <span class="brand-sub">粘贴 · 格式化 · 验证 · 多语言</span>
        </span>
        <span class="brand-chev">▾</span>
      </button>
    </h1>
    <div class="brand-menu" id="brandMenu" hidden>
      <button class="brand-item active" data-page="index.html">
        <span class="logo small">&lt;/&gt;</span>
        <span class="brand-item-text"><strong>Code 格式化</strong><em>粘贴 · 格式化 · 验证 · 多语言</em></span>
        <span class="brand-check">✓</span>
      </button>
      <button class="brand-item" data-page="qr.html">
        <span class="logo small"><svg viewBox="0 0 21 21" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M0 0h7v7H0zM1 1h5v5H1zM2 2h3v3H2zM14 0h7v7h-7zM15 1h5v5h-5zM16 2h3v3h-3zM0 14h7v7H0zM1 15h5v5H1zM2 16h3v3H2zM8 6h1v1H8zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h1v1h-1zM16 6h1v1h-1zM18 6h1v1h-1zM20 6h1v1h-1zM6 8h1v1H6zM6 10h1v1H6zM6 12h1v1H6zM6 14h1v1H6zM6 16h1v1H6zM6 18h1v1H6zM6 20h1v1H6zM9 1h1v1H9zM11 3h1v1h-1zM9 5h1v1H9zM12 2h1v1h-1zM10 8h1v1h-1zM12 9h1v1h-1zM9 11h1v1H9zM11 12h1v1h-1zM13 10h1v1h-1zM8 10h1v1H8zM16 9h1v1h-1zM18 11h1v1h-1zM15 12h1v1h-1zM17 14h1v1h-1zM19 16h1v1h-1zM9 18h1v1H9zM12 19h1v1h-1zM15 17h1v1h-1zM18 19h1v1h-1zM11 20h1v1h-1zM16 20h1v1h-1zM19 9h1v1h-1zM10 16h1v1h-1zM13 15h1v1h-1z"/></svg></span>
        <span class="brand-item-text"><strong>二维码 / 条码生成器</strong><em>QR Code · 条码</em></span>
      </button>
      <button class="brand-item" data-page="password.html">
        <span class="logo small"><svg viewBox="0 0 21 21" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="4"/><line x1="9.6" y1="9.6" x2="18" y2="18"/><line x1="14" y1="14" x2="17" y2="11"/><line x1="16.5" y1="16.5" x2="18.5" y2="14.5"/></g></svg></span>
        <span class="brand-item-text"><strong>密码生成器</strong><em>随机强密码 · 词组密码</em></span>
      </button>
    </div>
  </div>
  <div class="top-actions">
    <label class="theme-label">主题
      <select id="themeSelect">
        <option value="dark" selected>深色</option>
        <option value="light">浅色</option>
        <option value="retro">复古</option>
        <option value="oracle">Oracle</option>
        <option value="oracle-light">Oracle 白</option>
        <option value="datagrip">DataGrip</option>
        <option value="jetbrains">JetBrains</option>
      </select>
    </label>
  </div>
</header>

<section class="toolbar">
  <div class="group">
    <label>语言
      <select id="langSelect">
        <option value="auto" selected>自动检测</option>
        <option value="json">JSON</option>
        <option value="sql">SQL</option>
        <option value="python">Python</option>
        <option value="go">Go</option>
        <option value="java">Java</option>
      </select>
    </label>
    <button class="btn primary" id="btnFormat">格式化</button>
    <button class="btn" id="btnMinify">压缩</button>
  </div>
  <div class="group">
    <div class="more-wrap">
      <button class="btn" id="btnMore" aria-expanded="false" title="更多工具：验证、修复、缩进、JSONPath、复制 Markdown、下载、生成类型、转 YAML、对比、转义、分享、历史">更多工具 ▾</button>
      <div class="more-menu" id="moreMenu" hidden>
        <button class="menu-item" id="btnValidate">验证</button>
        <button class="menu-item" id="btnRepair" title="自动修复常见错误：尾随逗号、单引号、未加引号的键、注释">修复 JSON</button>
        <div class="menu-row">
          <span class="menu-label">缩进</span>
          <select id="indentSelect">
            <option value="2" selected>2 空格</option>
            <option value="4">4 空格</option>
            <option value="tab">Tab</option>
          </select>
        </div>
        <label class="menu-row check" id="sortKeysWrap"><input type="checkbox" id="sortKeys"> 按键名排序</label>
        <label class="menu-row check"><input type="checkbox" id="formatOnPaste" checked> 粘贴后自动格式化</label>
        <button class="menu-item" id="btnJpToggle" title="展开 JSONPath 查询栏">JSONPath 查询</button>
        <button class="menu-item" id="btnCopyMarkdown" title="复制为 Markdown 代码块（```json），粘到 Notion / Jira 是代码块，粘到 Word / 邮件保留颜色">复制 Markdown</button>
        <button class="menu-item" id="btnDownload">下载</button>
        <div class="menu-sep"></div>
        <div class="menu-row" id="typeRow">
          <span class="menu-label">生成类型</span>
          <select id="typeLang">
            <option value="ts" selected>TypeScript</option>
            <option value="go">Go</option>
            <option value="py">Python</option>
          </select>
          <button class="btn small" id="btnGenType" title="根据当前 JSON 生成所选语言的类型定义">生成</button>
        </div>
        <button class="menu-item" id="btnYaml" title="把当前 JSON 转成 YAML">转 YAML</button>
        <button class="menu-item" id="btnDiff" title="与第二份 JSON 逐行对比差异">对比 JSON</button>
        <button class="menu-item" id="btnEscape" title="把输入转成 JSON 转义字符串">转义</button>
        <button class="menu-item" id="btnUnescape" title="把 JSON 转义字符串还原">去转义</button>
        <button class="menu-item" id="btnShare" title="把当前 JSON 编进链接，复制后发给别人打开即是这份数据">分享链接</button>
        <button class="menu-item" id="btnShortcuts" title="查看与修改全部快捷键">快捷键设置</button>
        <div class="menu-row">
          <span class="menu-label">历史</span>
          <select id="historySelect">
            <option value="">最近的输入…</option>
          </select>
          <button class="btn small" id="btnClearHistory" title="删掉全部历史记录">清空</button>
        </div>
        <div class="menu-sep"></div>
        <label class="menu-row check"><input type="checkbox" id="rememberDraft" checked> 记住输入草稿与历史</label>
        <div class="menu-hint">草稿与历史仅保存在本机浏览器，7 天后过期；关闭后立即删除已存内容。</div>
      </div>
    </div>
  </div>
  <span class="spacer"></span>
  <div class="group">
    <div class="seg" id="viewSeg" role="tablist" aria-label="输出视图">
      <button class="seg-btn active" id="viewCode" role="tab">代码</button>
      <button class="seg-btn" id="viewTree" role="tab">树形</button>
    </div>
    <button class="btn" id="btnCopy">复制结果</button>
  </div>
</section>

<section class="toolbar secondary" id="jpBar" hidden>
  <div class="group jp-group">
    <label class="jp-label" for="jsonpathInput">JSONPath</label>
    <input type="text" id="jsonpathInput" placeholder="$.store.book[0].title 或 $..price" spellcheck="false">
    <button class="btn" id="btnJsonPath">查询</button>
    <span class="hint" id="jsonpathCount"></span>
  </div>
</section>

<section class="jp-results" id="jpResults" hidden>
  <div class="jp-results-head">
    <span>查询结果 <span class="hint" id="jpResultsCount"></span></span>
    <button class="btn ghost small" id="btnJpClose">关闭</button>
  </div>
  <div class="jp-results-body" id="jpResultsBody"></div>
</section>

<section class="diff-panel" id="diffPanel" hidden>
  <div class="diff-panel-head">
    <span>对比 JSON</span>
    <span class="hint">左侧输入为第一份，下面粘贴第二份，逐行对比差异</span>
    <button class="btn ghost small" id="btnDiffClose">关闭</button>
  </div>
  <textarea id="diffInput" placeholder="粘贴第二份 JSON…" spellcheck="false"></textarea>
  <div class="diff-panel-actions">
    <button class="btn primary" id="btnDoDiff">开始对比</button>
    <span class="hint" id="diffStats"></span>
  </div>
</section>

<main class="panes" id="panes">
  <section class="pane pane-left" id="paneLeft">
    <div class="pane-head">
      <span>输入</span>
      <span class="spacer"></span>
      <button class="btn ghost small" id="btnSample">载入示例</button>
      <button class="btn ghost small" id="btnUpload">打开文件</button>
      <input type="file" id="fileInput" accept=".json,.sql,.py,.go,.java,.txt,application/json,text/plain" hidden>
      <button class="btn ghost small" id="btnPaste">粘贴剪贴板</button>
      <button class="btn ghost small" id="btnClear">清空</button>
      <span class="hint" id="inputStats">0 字符</span>
    </div>
    <div class="editor-wrap">
      <div class="gutter" id="inputGutter">1</div>
      <textarea id="input" spellcheck="false" placeholder="在此粘贴代码，语言会自动检测…"></textarea>
    </div>
  </section>

  <div class="divider" id="divider" title="拖动调整左右宽度"></div>

  <section class="pane pane-right" id="paneRight">
    <div class="pane-head">
      <span>输出</span>
      <span class="hint" id="outputStats">等待输入</span>
    </div>
    <div class="output-wrap">
      <div class="tree-search" id="treeSearchWrap" hidden>
        <input type="text" id="treeSearch" placeholder="搜索键名或值…" spellcheck="false" aria-label="搜索树节点">
        <span class="hint" id="treeSearchCount"></span>
        <button class="btn ghost small" id="btnTreeSearchClear" title="清除搜索">×</button>
      </div>
      <pre id="output" class="code-view" tabindex="0"><code>格式化后的代码会显示在这里。</code></pre>
      <div id="tree" class="tree-view" tabindex="0" hidden></div>
      <div id="diffView" class="diff-view" hidden></div>
    </div>
  </section>
</main>

<footer class="statusbar">
  <span id="statusDot" class="dot idle"></span>
  <span id="statusText">就绪</span>
  <span class="spacer"></span>
  <span class="footer-hint" id="footerHint">Ctrl+Enter 格式化 · Ctrl+A 选中结果 · Ctrl+Alt+C 复制结果 · Ctrl+Alt+S 快捷键设置</span>
  <span id="detailStats"></span>
</footer>

<div class="toast" id="toast" hidden></div>

<div class="modal-overlay" id="shortcutOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="快捷键设置">
    <div class="modal-head">
      <h2>快捷键设置</h2>
      <button class="btn ghost small" id="btnShortcutClose">关闭</button>
    </div>
    <p class="modal-hint">点「更改」，然后按下新的组合键（至少包含 Ctrl / Cmd 或 Alt，Esc 取消）。改完自动保存。</p>
    <div id="shortcutList"></div>
    <div class="modal-foot">
      <button class="btn" id="btnShortcutReset">恢复默认</button>
    </div>
  </div>
</div>

<script src="sql-formatter.min.js"></script>
<script src="app.js"></script>
</body>
</html>
