<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化工作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">{ }</span>
    <div>
      <h1>JSON 格式化工作台</h1>
      <p>粘贴 · 格式化 · 验证 · 查询</p>
    </div>
  </div>
  <div class="top-actions">
    <label class="theme-label">主题
      <select id="themeSelect">
        <option value="dark" selected>深色</option>
        <option value="light">浅色</option>
        <option value="retro">复古</option>
        <option value="oracle">Oracle</option>
        <option value="oracle-light">Oracle 白</option>
        <option value="datagrip">DataGrip</option>
        <option value="jetbrains">JetBrains</option>
      </select>
    </label>
  </div>
</header>

<section class="toolbar">
  <div class="group">
    <button class="btn primary" id="btnFormat">格式化</button>
    <button class="btn" id="btnMinify">压缩</button>
    <button class="btn" id="btnValidate">验证</button>
    <button class="btn" id="btnRepair" title="自动修复常见错误：尾随逗号、单引号、未加引号的键、注释">修复 JSON</button>
  </div>
  <div class="group options">
    <label>缩进
      <select id="indentSelect">
        <option value="2" selected>2 空格</option>
        <option value="4">4 空格</option>
        <option value="tab">Tab</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="sortKeys"> 按键名排序</label>
    <label class="check"><input type="checkbox" id="formatOnPaste" checked> 粘贴后自动格式化</label>
  </div>
  <div class="group">
    <button class="btn" id="btnJpToggle" title="展开 JSONPath 查询栏">JSONPath</button>
    <div class="more-wrap">
      <button class="btn" id="btnMore" aria-expanded="false" title="更多工具：生成类型、转 YAML、对比、转义、分享、历史">更多工具 ▾</button>
      <div class="more-menu" id="moreMenu" hidden>
        <div class="menu-row">
          <span class="menu-label">生成类型</span>
          <select id="typeLang">
            <option value="ts" selected>TypeScript</option>
            <option value="go">Go</option>
            <option value="py">Python</option>
          </select>
          <button class="btn small" id="btnGenType" title="根据当前 JSON 生成所选语言的类型定义">生成</button>
        </div>
        <button class="menu-item" id="btnYaml" title="把当前 JSON 转成 YAML">转 YAML</button>
        <button class="menu-item" id="btnDiff" title="与第二份 JSON 逐行对比差异">对比 JSON</button>
        <button class="menu-item" id="btnEscape" title="把输入转成 JSON 转义字符串">转义</button>
        <button class="menu-item" id="btnUnescape" title="把 JSON 转义字符串还原">去转义</button>
        <button class="menu-item" id="btnShare" title="把当前 JSON 编进链接，复制后发给别人打开即是这份数据">分享链接</button>
        <div class="menu-row">
          <span class="menu-label">历史</span>
          <select id="historySelect">
            <option value="">最近的输入…</option>
          </select>
        </div>
      </div>
    </div>
  </div>
  <span class="spacer"></span>
  <div class="group">
    <div class="seg" role="tablist" aria-label="输出视图">
      <button class="seg-btn active" id="viewCode" role="tab">代码</button>
      <button class="seg-btn" id="viewTree" role="tab">树形</button>
    </div>
    <button class="btn" id="btnCopy">复制结果</button>
    <button class="btn" id="btnDownload">下载</button>
  </div>
</section>

<section class="toolbar secondary" id="jpBar" hidden>
  <div class="group jp-group">
    <label class="jp-label" for="jsonpathInput">JSONPath</label>
    <input type="text" id="jsonpathInput" placeholder="$.store.book[0].title 或 $..price" spellcheck="false">
    <button class="btn" id="btnJsonPath">查询</button>
    <span class="hint" id="jsonpathCount"></span>
  </div>
</section>

<section class="jp-results" id="jpResults" hidden>
  <div class="jp-results-head">
    <span>查询结果 <span class="hint" id="jpResultsCount"></span></span>
    <button class="btn ghost small" id="btnJpClose">关闭</button>
  </div>
  <div class="jp-results-body" id="jpResultsBody"></div>
</section>

<section class="diff-panel" id="diffPanel" hidden>
  <div class="diff-panel-head">
    <span>对比 JSON</span>
    <span class="hint">左侧输入为第一份，下面粘贴第二份，逐行对比差异</span>
    <button class="btn ghost small" id="btnDiffClose">关闭</button>
  </div>
  <textarea id="diffInput" placeholder="粘贴第二份 JSON…" spellcheck="false"></textarea>
  <div class="diff-panel-actions">
    <button class="btn primary" id="btnDoDiff">开始对比</button>
    <span class="hint" id="diffStats"></span>
  </div>
</section>

<main class="panes" id="panes">
  <section class="pane pane-left" id="paneLeft">
    <div class="pane-head">
      <span>输入</span>
      <span class="spacer"></span>
      <button class="btn ghost small" id="btnSample">载入示例</button>
      <button class="btn ghost small" id="btnUpload">打开文件</button>
      <input type="file" id="fileInput" accept=".json,application/json,text/plain" hidden>
      <button class="btn ghost small" id="btnPaste">粘贴剪贴板</button>
      <button class="btn ghost small" id="btnClear">清空</button>
      <span class="hint" id="inputStats">0 字符</span>
    </div>
    <div class="editor-wrap">
      <div class="gutter" id="inputGutter">1</div>
      <textarea id="input" spellcheck="false" placeholder='在此粘贴 JSON，例如：{"name": "Muse", "version": 1}'></textarea>
    </div>
  </section>

  <div class="divider" id="divider" title="拖动调整左右宽度"></div>

  <section class="pane pane-right" id="paneRight">
    <div class="pane-head">
      <span>输出</span>
      <span class="hint" id="outputStats">等待输入</span>
    </div>
    <div class="output-wrap">
      <pre id="output" class="code-view" tabindex="0"><code>格式化后的 JSON 会显示在这里。</code></pre>
      <div id="tree" class="tree-view" tabindex="0" hidden></div>
      <div id="diffView" class="diff-view" hidden></div>
    </div>
  </section>
</main>

<footer class="statusbar">
  <span id="statusDot" class="dot idle"></span>
  <span id="statusText">就绪</span>
  <span class="spacer"></span>
  <span class="footer-hint">Ctrl+Enter 格式化 · Ctrl+A 选中结果 · 树形中 Ctrl+L 展开全部</span>
  <span id="detailStats"></span>
</footer>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
