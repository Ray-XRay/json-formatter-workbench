<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MyWorkbench 2.0 — JSON / SQL 格式化、密码与助记词、QR / 条码、香港到站看板，四合一工具站。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MyWorkbench 2.0</title>
    <script>
      // No-flash theme: set the theme class before first paint.
      // Mirrors src/composables/useTheme.ts — storage key 'wb20-theme',
      // modes light / dark / system (default: follow OS).
      try {
        var stored = localStorage.getItem('wb20-theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
        }
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {
        /* storage / matchMedia unavailable — fall back to light */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
